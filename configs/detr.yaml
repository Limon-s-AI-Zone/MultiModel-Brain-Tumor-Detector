# DETR training configuration
model_name: "facebook/detr-resnet-50"
num_classes: 4
id2label:
  0: glioma
  1: meningioma
  2: no_tumor
  3: pituitary
label2id:
  glioma: 0
  meningioma: 1
  no_tumor: 2
  pituitary: 3

# Training
epochs: 50
batch_size: 4
lr: 1e-4
lr_backbone: 1e-5
weight_decay: 1e-4
warmup_steps: 100
gradient_accumulation_steps: 4

# Data
image_size: 512
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

# Augmentations (for medical images)
augmentations:
  horizontal_flip: 0.5
  random_rotation: 15
  brightness: 0.2
  contrast: 0.2

# Checkpointing
output_dir: "output/detr"
save_steps: 500
eval_steps: 500
logging_steps: 100
save_total_limit: 3

# Hardware
fp16: true
num_workers: 4